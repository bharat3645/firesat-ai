name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests scripts

      - name: Run test suite
        run: pytest -q --cov=firesat --cov-report=term-missing

  pipeline-smoke-test:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # A 2022-2023 (24 month) range used to be passed here, but the model's
      # 24-month lookback (SEQUENCE_LENGTH) plus its longest forecast
      # horizon (6 months, HORIZONS_MONTHS) together need at least 30
      # months of history before a single training anchor has fully-observed
      # labels - with exactly 24 months there are zero valid anchors in
      # *either* split, so `train_demo.py` below failed with "num_samples
      # should be a positive integer value, but got num_samples=0" before
      # any training ever ran. 5 years gives every horizon comfortable
      # headroom in both the train and validation splits.
      - name: Regenerate a small synthetic dataset (smoke test, isolated dir)
        run: |
          python scripts/generate_demo_data.py --start-year 2022 --end-year 2026 \
            --seed 123 --out-dir /tmp/firesat_smoke_data

      - name: Train for one epoch (smoke test, isolated checkpoint)
        run: |
          python scripts/train_demo.py --data-dir /tmp/firesat_smoke_data \
            --checkpoint /tmp/firesat_smoke_model.pt --epochs 1 --batch-size 8 \
            --metrics-out /tmp/firesat_smoke_metrics.json

      - name: Verify API boots against the smoke-tested checkpoint
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from firesat.inference import InferenceService, get_inference_service
          from firesat.api.main import app

          service = InferenceService(
              checkpoint_path="/tmp/firesat_smoke_model.pt",
              data_dir="/tmp/firesat_smoke_data",
          )
          service.load()
          assert service.ready, service.status_message
          app.dependency_overrides[get_inference_service] = lambda: service

          with TestClient(app) as client:
              health = client.get("/api/health").json()
              assert health["ready"] is True, health
              regions = client.get("/api/regions").json()
              for region in regions:
                  r = client.get(f"/api/risk/{region['id']}")
                  assert r.status_code == 200, r.text
          print("Smoke test OK:", health)
          PY
